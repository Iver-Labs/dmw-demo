apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: dmw-demo
  labels:
    cloud.googleapis.com/location: asia-southeast1
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "2"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      serviceAccountName: dmw-demo-run@PROJECT_ID.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - image: asia-southeast1-docker.pkg.dev/PROJECT_ID/dmw-demo/web:GIT_SHA
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 2Gi # fp32 e5-small (notebook precision) peaks ~1.35 GB RSS; 1Gi would OOM
          env:
            - name: SEALION_MODEL
              value: aisingapore/Llama-SEA-LION-v3-70B-IT
            - name: SEALION_THINKING_OFF
              value: "false"
            - name: EMBED_MODEL
              value: Xenova/multilingual-e5-small
            - name: EMBED_DIMS
              value: "384"
            - name: RETRIEVAL_MIN_SCORE
              value: "0"
            - name: SEALION_API_KEY
              valueFrom:
                secretKeyRef: { name: sealion-api-key, key: "1" }
          startupProbe:
            httpGet: { path: /api/health, port: 8080 }
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 20
